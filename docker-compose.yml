version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: progra3-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ABCpassword
      POSTGRES_DB: db_progra3
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: